spring.application.name=SupportAI

spring.config.import=optional:classpath:application-local.properties
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/tms}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# JWT
app.jwt.expiration-minutes=60

# Groq chatbot settings (set GROQ_API_KEY in the backend environment)
groq.api.key=${GROQ_API_KEY:}
groq.api.model=${GROQ_API_MODEL:openai/gpt-oss-20b}
groq.mock.enabled=${GROQ_MOCK_ENABLED:${openai.mock.enabled:false}}

# Production frontend and OAuth configuration
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
